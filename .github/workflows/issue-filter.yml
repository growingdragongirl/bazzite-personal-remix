name: Filter unsupported issues

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

concurrency:
  group: issue-filter-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:  # added using https://github.com/step-security/secure-repo
  contents: read

jobs:
  filter-issues:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.state == 'open' &&
      (contains(github.event.issue.title, 'ps5') ||
       contains(github.event.issue.body, 'ps5'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Close issues mentioning PS5
        uses: peter-evans/close-issue@05dff7ca07116e5707cfb3a3cd4af7bb5e43524c # v3
        with:
          close-reason: not_planned
          labels: wontfix,auto-closed-ps5
          comment: >-
            The PS5 version of Bazzite is unofficial and is not supported by the
            Bazzite team. Please report issues to the maintainers of that version
            [here](https://github.com/VivaLaVent/ps5-bazzite-deck/issues).
            If this was closed in error, reply to this comment to reopen the issue.

  reopen-issues:
    if: >-
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      github.event.issue.state == 'closed' &&
      github.event.issue.state_reason == 'not_planned' &&
      contains(github.event.issue.labels.*.name, 'auto-closed-ps5') &&
      github.event.comment.user.type == 'User' &&
      github.event.comment.user.login == github.event.issue.user.login
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Reopen after a reply from the issue author
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue reopen "$ISSUE_NUMBER"
          gh issue edit "$ISSUE_NUMBER" --remove-label wontfix --remove-label auto-closed-ps5
